<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}html,body{height:100%;margin:0}*{box-sizing:border-box}

.top{padding:12px 16px 8px;display:grid;gap:9px}.tr{display:flex;justify-content:space-between;align-items:center}
.brand{font:700 18px "Familjen Grotesk";display:flex;gap:8px;align-items:center}.bm{width:28px;height:28px;border-radius:8px 8px 8px 2px;background:var(--navy);color:var(--hi);display:grid;place-items:center}

nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px 8px}nav button{flex:1;display:grid;justify-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0;min-height:52px;position:relative}

h1{font-size:27px;line-height:1.1;margin:10px 0 4px}.sub{color:var(--muted);font-size:13.5px;margin:0 0 14px}

.label small{color:var(--muted);font-size:12px}.label b{font:700 20px/26px "Familjen Grotesk";display:block}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tile{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--g);border-radius:6px 14px 14px 6px;padding:11px 11px 11px 12px;display:grid;gap:4px;min-height:92px;align-content:start}.tile b{font-weight:700;font-size:14px}.tile small{color:var(--muted);font-size:12px;line-height:1.3}.tile svg{color:var(--g)}

.av{width:40px;height:40px;border-radius:13px 13px 13px 4px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.hd{width:7px;height:7px;border-radius:50%;background:var(--line);display:inline-block}.hd.P{background:var(--ee)}.hd.A{background:var(--be)}
.tog{width:88px;height:42px;border-radius:12px;font-weight:700;border:1.5px solid var(--line);text-align:center;flex:none}.tog.P{background:var(--ee);border-color:var(--ee);color:#fff}.tog.A{background:var(--be);border-color:var(--be);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 13px;font-size:13px;font-weight:600}.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.band{min-width:34px;text-align:center;border-radius:7px;padding:3px 0;font-weight:700;font-size:12px;color:#fff;background:var(--line)}.band.EE{background:var(--ee)}.band.ME{background:var(--me)}.band.AE{background:var(--ae)}.band.BE{background:var(--be)}
.score{width:70px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);text-align:center;font:700 18px "Familjen Grotesk"}
label{display:block;font-weight:600;font-size:13px;margin:12px 0 5px}.f{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;min-height:46px}textarea.f{min-height:84px;resize:vertical}
.tally{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}.tally div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 11px}.tally b{display:block;font:700 24px "Familjen Grotesk"}.tally span{font-size:12px;color:var(--muted)}
.dist{display:flex;height:10px;border-radius:9px;overflow:hidden;background:var(--line);gap:2px;margin:6px 0}.dist i{display:block}.lg{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700}
.note{background:color-mix(in srgb,var(--hi) 24%,var(--card));border-radius:12px;padding:10px 13px;font-size:13.5px;margin-bottom:12px}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:18px;text-align:center;color:var(--muted);font-size:13.5px;margin-bottom:12px;background:var(--card)}
.back{display:inline-flex;align-items:center;gap:4px;font-weight:600;color:var(--muted);padding:8px 0}
.pill{font-size:12px;font-weight:700;border-radius:99px;padding:4px 9px;background:var(--bg);border:1px solid var(--line)}
.slot{display:grid;grid-template-columns:96px 1fr;gap:8px;padding:9px 0;border-top:1px solid var(--line);align-items:center}.slot:first-child{border-top:0}.slot time{font-size:12.5px;font-weight:700}.slot.b{color:var(--muted);font-size:12.5px}
.les{border-left:4px solid var(--me);padding-left:9px}.les small{display:block;color:var(--muted);font-size:12.5px}
.sheet{position:absolute;inset:0;background:rgba(6,12,22,.6);display:flex;align-items:flex-end;z-index:20}.sheet[hidden]{display:none}
.panel{width:100%;max-height:86%;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:10px 16px 22px;animation:up .25s ease-out}@keyframes up{from{transform:translateY(40px);opacity:0}}
.grab{width:42px;height:5px;background:var(--line);border-radius:9px;margin:0 auto 12px}
.toast{position:absolute;left:50%;bottom:84px;transform:translate(-50%,12px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:99px;font-weight:600;font-size:13.5px;opacity:0;pointer-events:none;transition:.2s;z-index:30;white-space:nowrap;max-width:92%}.toast.on{opacity:1;transform:translate(-50%,0)}
.sw{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:8px 0;border-top:1px solid var(--line)}.sw span.k{width:38px;height:22px;border-radius:99px;background:var(--line);position:relative;flex:none}.sw span.k:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}.sw[aria-pressed=true] span.k{background:var(--ee)}.sw[aria-pressed=true] span.k:after{left:19px}
.sw small{display:block;color:var(--muted);font-size:12px}
details{border-top:1px solid var(--line);padding:10px 0}summary{font-weight:600;cursor:pointer}details p{margin:6px 0 0;color:var(--muted);font-size:13.5px}
.fab{position:fixed;display:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="stage">
  <aside class="adm" id="adm" aria-label="Admin allocations"></aside>
  <div class="app">
    <header class="top" id="top"></header>
    <main id="main" aria-live="polite"></main>
    <nav id="nav" aria-label="Main"></nav>
    <div class="sheet" id="sheet" hidden><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>
    <div class="toast" id="toast" role="status"></div>
  </div>
</div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P={home:'M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',att:'M4 5h16v15H4zM8 3v4M16 3v4M4 10h16M8 15l2.5 2.5L16 13',marks:'M5 3h14v18H5zM8 8h8M8 12h3M13 12h3M8 16h3M13 16h3',grid:'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z',me:'M12 4a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM4 21a8 8 0 0 1 16 0',plan:'M5 3h14v18H5zM9 8h6M9 12h6M9 16h3',scheme:'M4 5h16v4H4zM4 11h10M4 15h16M4 19h8',time:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 7v5l3 2',rw:'M4 20l4-1 11-11-3-3L5 16zM14 6l3 3',prog:'M3 3v18h18M7 15l4-4 3 2 5-6',kicd:'M4 4h5v16H4zM11 4h5v16h-5zM18 5l3 .8-3 14.2z',obs:'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z',learn:'M9 4a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zM2 20a7 7 0 0 1 14 0M17 5a3 3 0 0 1 0 6M19 20a6 6 0 0 0-3-5',broad:'M4 4h16v16H4zM4 10h16M4 15h16M10 4v16',report:'M6 2h9l5 5v15H6zM14 2v6h6M9 13h8M9 17h8',path:'M12 3v18M5 6h11l3 3-3 3H5zM19 14H8l-3 3 3 3h11z',fees:'M3 6h18v12H3zM3 10h18M7 15h4',wa:'M20 11.5a7.5 7.5 0 0 1-7.5 7.5H6l-3 2v-6.5A7.5 7.5 0 1 1 20 11.5z',chev:'M6 9l6 6 6-6',back:'M15 6l-6 6 6 6',go:'M9 6l6 6-6 6',ok:'M5 12l5 5 9-10',lock:'M6 11h12v10H6zM8 11V8a4 4 0 0 1 8 0v3',phone:'M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z'};
const ic=(n,s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${P[n]}"/></svg>`;
/* The 16 services an admin can grant (same keys as the school system) */
const SV=[['dashboard','Dashboard','home','Overview tiles for your classes',''],['lesson_plans','Lesson plans','plan','Write and store lesson plans','Teaching'],['schemes','Schemes of work','scheme','Termly scheme rows from KICD designs','Teaching'],['timetable','Timetable','time','Your weekly lessons','Teaching'],['recordwork','Record of work','rw','What was actually taught','Teaching'],['kicd','KICD designs','kicd','Curriculum design library','Teaching'],['learners','Learners','learn','Records and guardian contacts','Learners'],['observations','Observations','obs','Notes on how learners are doing','Learners'],['progress','Learner progress','prog','Stage of achievement per learner','Learners'],['reportcards','Report cards','report','End-of-term summaries','Learners'],['attendance','Attendance','att','Daily class register','Assessment'],['marks','Marksbook','marks','Enter and edit subject scores','Assessment'],['broadsheet','Broadsheet','broad','Ranked class analysis','Assessment'],['pathways','Pathways','path','Grade 9 pathway recommendations','Assessment'],['fees','Fee payments','fees','Balances and payment posting','School'],['whatsapp','WhatsApp','wa','Messages to guardians','School']];
const GC={Teaching:'var(--me)',Learners:'var(--ee)',Assessment:'var(--ae)',School:'var(--be)'};
const ST=['Grade 1 Alpha','Grade 2 Beta','Grade 3 Gamma','Grade 4 Delta','Grade 5 Epsilon','Grade 6 Zeta','Grade 7 Eta','Grade 8 Theta','Grade 9 Iota'];
const PS=['Mathematics','English Language','Kiswahili / KSL','Environmental Activities','Religious Education','Creative Arts & Movement'],JS=['English Language','Kiswahili','Mathematics','Integrated Science','Social Studies','Agriculture & Nutrition','Pre-Technical Studies','Creative Arts & Sports','Religious Education (CRE)'];
const subs=c=>+c.split(' ')[1]<=6?PS:JS,NM=['Amina Mohamed','Brian Otieno','Cynthia Wanjiru','Dennis Kiprop','Esther Achieng','Faith Muthoni','Hassan Abdi','Irene Njeri','Joel Mwangi','Kevin Omondi','Lucy Chebet','Mark Kariuki','Naomi Wafula','Peter Ndungu','Ruth Akinyi','Samuel Kimani','Tabitha Nduta','Victor Oloo'];
const PER=[['8:20','8:55',1],['8:55','9:30',2],['9:30','9:50','Break'],['9:50','10:25',3],['10:25','11:00',4],['11:00','11:25','Break'],['11:25','12:00',5],['12:00','12:35',6],['12:35','2:00','Lunch'],['2:00','2:35',7],['2:35','4:00',8]];
const DAYS=['Mon','Tue','Wed','Thu','Fri'],SECS=['Specific learning outcomes','Core competencies','Key inquiry question','Learning resources','Organization of learning','Introduction','Lesson development','Conclusion','Extended activity','Reflection'];
const S={v:'home',cls:'Grade 4 Delta',streams:['Grade 4 Delta','Grade 7 Eta','Grade 9 Iota'],svc:new Set(SV.map(s=>s[0])),must:false,att:{},saved:{},scores:{},pend:0,day:1,q:'',f:{},recs:{obs:[],prog:[],rw:[],wa:[],plan:[]},pay:{},cm:{}};
const LC={};const LR=c=>LC[c]||(LC[c]=[0,1,2,3,4,5].map(i=>{const si=ST.indexOf(c);return{i,id:si+'-'+i,name:NM[(si*5+i)%18],adm:String(4100+si*10+i),upi:'NEM-'+(7000+si*37+i*11),ph:'+25471'+(2000000+si*97000+i*13100),tot:45000,paid:[45000,30000,45000,15000,45000,38000][i],pct:[100,92,96,78,100,88][i],h:['PPPPP','PPAPP','PPPAP','APAAP','PPPPP','PAPPP'][i]}}));
const L=()=>LR(S.cls),can=id=>S.svc.has(id),ini=n=>n.split(' ').map(w=>w[0]).join('').slice(0,2);
const rb=v=>v===''||v==null?'':v>=80?'EE':v>=60?'ME':v>=40?'AE':'BE',pt={EE:4,ME:3,AE:2,BE:1};
const sc=(c,l,sub)=>{const k=sub+'|'+c+'|'+l.i;return S.scores[k]!==undefined&&S.scores[k]!==''?+S.scores[k]:38+((ST.indexOf(c)*31+l.i*17+sub.length*13+sub.charCodeAt(0))*7)%58};
const area=()=>S.f.area&&subs(S.cls).includes(S.f.area)?S.f.area:subs(S.cls)[0];
const ak=i=>S.cls+'|'+i,mk=i=>area()+'|'+S.cls+'|'+i;
function TT(d){const o={};for(let n=1;n<=8;n++)if((n*3+d)%4<2){const c=S.streams[(n+d)%S.streams.length];o[n]={n,c,sub:subs(c)[(n+d*2)%subs(c).length]}}return o}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2300)}
const pend=()=>{S.pend++;chrome()};
const head=(t,s,back=1)=>`${back?`<button class="back" data-v="svc">${ic('back',18)}All services</button>`:''}<h1>${t}</h1><p class="sub">${s}</p>`;
const emp=m=>`<div class="empty">${m}</div>`;
/* ---------- generic record forms (observations, progress, record of work, WhatsApp, lesson plans) ---------- */
const FM={
obs:{svc:'observations',t:'Observations',s:'Notes on how learners are doing',req:'note',btn:'Save observation',fl:[['learner','Learner','learner'],['type','Type','chips',['Strength','Needs support','Participation','Wellbeing']],['note','What did you notice?','ta']],show:r=>[r.learner+' · '+r.type,r.note]},
prog:{svc:'progress',t:'Learner progress',s:'Record the stage a learner has reached',req:'note',btn:'Save progress',fl:[['learner','Learner','learner'],['sub','Learning area','sub'],['stage','Stage of achievement','chips',['Beginning','Developing','Secure','Exceeding']],['note','Note','ta']],show:r=>[r.learner+' · '+r.stage,r.sub+'. '+r.note]},
rw:{svc:'recordwork',t:'Record of work',s:'What you actually taught',req:'topic',btn:'Save record',fl:[['sub','Learning area','sub'],['topic','Topic','txt'],['work','Work covered','ta'],['abs','Absences today','txt'],['hw','Homework','txt'],['rem','Remarks','ta']],show:r=>[r.sub+' · '+r.topic,r.work||'No details added']},
wa:{svc:'whatsapp',t:'WhatsApp',s:'Message a learner’s guardian',req:'msg',btn:'Send message',fl:[['learner','Learner','learner'],['tpl','Starter','chips',['Fee reminder','Absence check','Progress update']],['msg','Message','ta']],show:r=>[r.learner+' · '+r.tpl,r.msg]},
plan:{svc:'lesson_plans',t:'Lesson plans',s:'Write a plan using the ten CBC sections',req:'topic',btn:'Save plan',fl:[['sub','Learning area','sub'],['topic','Topic','txt']].concat(SECS.map((x,i)=>['s'+i,x,'ta'])),show:r=>[r.sub+' · '+r.topic,r.s0||'Draft plan']}};
const dv=(t,o)=>t==='learner'?L()[0].name:t==='sub'?subs(S.cls)[0]:t==='chips'?o[0]:'';
function form(k){const c=FM[k],f=S.f[k]||(S.f[k]={});const body=c.fl.map(([n,l,t,o])=>{const v=f[n]??dv(t,o),id=`${k}.${n}`;
if(t==='chips')return `<label>${l}</label><div class="chips" role="group">${o.map(x=>`<button class="chip" data-chip="${id}|${x}" aria-pressed="${x===v}">${x}</button>`).join('')}</div>`;
if(t==='learner'||t==='sub')return `<label for="${id}">${l}</label><select class="f" id="${id}" data-f="${id}">${(t==='learner'?L().map(x=>x.name):subs(S.cls)).map(x=>`<option ${x===v?'selected':''}>${E(x)}</option>`).join('')}</select>`;
return `<label for="${id}">${l}</label>${t==='ta'?`<textarea class="f" id="${id}" data-f="${id}">${E(v)}</textarea>`:`<input class="f" id="${id}" data-f="${id}" value="${E(v)}">`}`}).join('');
const rs=S.recs[k].filter(r=>r.cls===S.cls);
